services:
  dashboard:
    image: python:3.12-slim          # stock image — no build step, no buildx needed
    container_name: gateway-dashboard
    working_dir: /app
    ports:
      - "8501:8501"                  # exposed on the host (see README for SSM port-forward)
    environment:
      PGHOST: postgres               # resolves on the gateway's docker network
      PGPORT: "5432"
      PGUSER: gw
      PGPASSWORD: gw
      PGDATABASE: gateway
      PIP_ROOT_USER_ACTION: ignore
    volumes:
      - ./app.py:/app/app.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               streamlit run app.py
               --server.address=0.0.0.0
               --server.port=8501
               --server.headless=true
               --browser.gatherUsageStats=false"
    networks:
      - gwnet
    restart: unless-stopped

# Join the network the gateway stack already created.
# `docker network ls` — it's the one ending in "_gw" (usually gateway_gw).
# If yours differs, change `name:` below to match.
networks:
  gwnet:
    external: true
    name: gateway_gw
